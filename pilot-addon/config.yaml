name: Pilot
version: 0.4.2
slug: pilot
description: Proactive AI agent for Home Assistant — goal supervisor, data vitrine, trust loop. Powered by OpenClaw.
url: https://github.com/Glukmann/HA_Pilot
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
homeassistant_api: true
discovery:
  - pilot
ports:
  8899/tcp: null
options:
  log_level: info
  daily_budget: 10.0
  ha_token: ""
schema:
  log_level: list(info|warning|error)?
  daily_budget: float
  ha_token: str
