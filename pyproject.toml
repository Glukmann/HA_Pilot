[tool.ruff]
target-version = "py314"
src = ["custom_components"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "custom_components"
files = "custom_components/pilot, pilot-addon/rootfs/app/pilot_addon"
ignore_missing_imports = true
explicit_package_bases = true
