[tool.ruff]
target-version = "py312"
src = ["custom_components"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

# The supervisor speaks Russian by design (system prompt and journal format,
# docs/2026-09-13-supervisor-design.md §4); its strings trip the ambiguous
# Cyrillic/Latin lookalike check. Comments and identifiers stay ASCII.
[tool.ruff.lint.per-file-ignores]
"pilot-addon/rootfs/app/pilot_addon/supervisor.py" = ["RUF001"]
"tests/test_supervisor.py" = ["RUF001"]
"tests/test_prompts_skills.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "custom_components"
files = "custom_components/pilot, pilot-addon/rootfs/app/pilot_addon"
ignore_missing_imports = true
explicit_package_bases = true
