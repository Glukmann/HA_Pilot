# Clean test stand: Home Assistant Container + Pilot add-on container.
# Isolated from any real home. No Supervisor here, so the integration is
# configured via the manual user step (host/port) instead of hassio discovery.

services:
  ha:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: pilot-test-ha
    privileged: true
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./ha-config:/config
      - ../custom_components:/config/custom_components:ro
    environment:
      - TZ=Europe/Moscow

  pilot-addon:
    build:
      # The workshop sources live inside the add-on folder, so this context
      # is enough for the full image (same as Supervisor source-installs).
      context: ../pilot-addon
    image: pilot-addon:test
    container_name: pilot-test-addon
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - PILOT_DATA=/data
    volumes:
      - ./addon-data:/data
    # The vitrine is fed by pushes from the HA integration (mounted above),
    # so no HA_WS/HA_TOKEN env is needed here.
